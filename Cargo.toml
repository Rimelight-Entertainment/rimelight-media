[package]
name = "rimelight-media"
version = "0.1.6"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
description = "Rimelight Media: pictures, video, music, screenshots and screen recording in one small app"
default-run = "rimelight-media"

# Same rule as rimelight-space: no unsafe code, except the audited modules that talk to Windows (src/platform.rs, src/capture/camera.rs), read
# FFmpeg's picture subtitles (src/media/bitmap_sub.rs), HEIF pictures through FFmpeg's stream groups (src/picture_heif.rs)
# and the code Slint generates (src/ui.rs).
[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unsafe_code = "deny"

[dependencies]
# The window and every screen. Femtovg draws on the GPU; the software renderer is the fallback.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
# Pictures: decode and save. Only the formats the app opens (GIF and WebP with their animation frames).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
# Camera RAW pictures (pure Rust, LGPL-2.1): developed to RGB, or the embedded JPEG when developing fails.
rawler = "0.7"
# SVG pictures and the markup layer (text uses the system fonts). Same version Slint already uses.
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
# Video and sound decoding and encoding (rimelight-space decision 0046). Without FFmpeg's device and filter libraries:
# the screen is grabbed with Windows' own calls and playback speed is done here, so avdevice and avfilter (37 MB) don't ship.
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
# Sound output, microphone and the system-sound loopback.
cpal = "0.18"
# PrintScreen and the other global keys.
global-hotkey = "0.7"
# Copy screenshots to the clipboard.
arboard = "3.7"
# Open and save dialogs.
rfd = "0.15"
# Text tab: Markdown preview (tables, task lists, strikethrough).
pulldown-cmark = { version = "0.13", default-features = false }
# Text tab: JSON format, minify, validate, sort keys and the tree view (key order kept).
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"

[target.'cfg(windows)'.dependencies]
# File types, default apps and the start-up entry (all per user, no admin).
winreg = "0.56"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls_Dialogs",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# Windows' Share panel and its built-in text recognition (WinRT). Already in the build through cpal; only these parts
# are added.
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
# Installer and self-update from GitHub Releases (the rimelight-space installer, decision 0047). The crate and the vpk
# tool (dotnet-tools.json) must be the same version.
velopack = "=1.3.39-g8d2844f"

[build-dependencies]
slint-build = "=1.18.1"
# The app icon inside the exe (shortcuts, taskbar, Explorer), compiled with the Windows SDK's rc.exe.
embed-resource = "3"

# ffmpeg-sys-next with its bindings checked in (copied from rimelight-space/vendor), so building needs neither clang nor
# the FFmpeg headers. FFmpeg itself comes from tools/get-ffmpeg.ps1 (FFMPEG_DIR in .cargo/config.toml).
[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.dev.build-override]
opt-level = 3

# Small and fast: one codegen unit, whole-program optimisation, no symbols, size-leaning optimisation, no unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The decoders that run per pixel or per sample stay at full speed.
[profile.release.package.image]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
[profile.release.package.gif]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
